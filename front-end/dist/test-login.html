<!DOCTYPE html>
<html>
<head>
    <title>Test Login</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        pre { background: #f0f0f0; padding: 10px; overflow-x: auto; }
        button { padding: 10px 20px; font-size: 16px; }
    </style>
</head>
<body>
    <h1>Frontend Login Test</h1>
    <button onclick="testLogin()">Test Login with aaa/aaa</button>
    <pre id="output"></pre>
    
    <script>

        function getApiUrl() {

            const hostname = window.location.hostname;

            if (hostname === 'localhost' || hostname === '127.0.0.1') {
                return 'http://localhost:8000';
            }

            return ''; 
        }

        const API_URL = getApiUrl();

        async function testLogin() {
            const output = document.getElementById('output');
            output.innerHTML = 'Starting test...\n';
            
            try {
                // Step 1: Login
                output.innerHTML += '1. Logging in with aaa/aaa...\n';
                const loginResp = await fetch(`${API_URL}/api/login/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email: 'aaa', password: 'aaa' })
                });
                output.innerHTML += `   Status: ${loginResp.status}\n`;
                const loginData = await loginResp.json();
                output.innerHTML += `   Response: ${JSON.stringify(loginData)}\n`;
                
                // Step 2: Get user
                output.innerHTML += '\n2. Getting user data...\n';
                const userResp = await fetch(`${API_URL}/api/user/`, {
                    credentials: 'include'
                });
                output.innerHTML += `   Status: ${userResp.status}\n`;
                const userData = await userResp.json();
                output.innerHTML += `   Response: ${JSON.stringify(userData, null, 2)}\n`;
                
                if (userData.authenticated) {
                    output.innerHTML += '\n✓ TEST PASSED! User is authenticated!';
                } else {
                    output.innerHTML += '\n✗ TEST FAILED! User is not authenticated!';
                }
            } catch (e) {
                output.innerHTML += `\nERROR: ${e.message}\n${e.stack}`;
            }
        }
    </script>
</body>
</html>
